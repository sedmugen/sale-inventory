# ===================================
# APPLICATION INFO
# ===================================
spring.application.name=sale-inventory-backend

# ===================================
# DATABASE CONFIGURATION
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/sales-inventory-db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=batmanbinsuperman
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / HIBERNATE CONFIGURATION
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Use snake_case naming strategy (camelCase -> snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ===================================
# LOGGING
# ===================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.webeng.inventory=DEBUG

# ===================================
# SERVER CONFIGURATION
# ===================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ===================================
# VALIDATION
# ===================================
#spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false